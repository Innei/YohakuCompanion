name: Distribution dry run

# Temporary. Validates Developer ID signing, hardened runtime, and notarization
# without creating a tag or publishing anything. Delete once the first
# Developer ID release has succeeded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    name: Sign and notarize without publishing
    runs-on: macos-26
    timeout-minutes: 60

    env:
      ARCHIVE_PATH: ${{ github.workspace }}/build/YohakuCompanion.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      DIST_PATH: ${{ github.workspace }}/build/dist
      SOURCE_PACKAGES_PATH: ${{ github.workspace }}/build/SourcePackages
      SPARKLE_FEED_URL: https://github.com/Innei/YohakuCompanion/releases/latest/download/appcast.xml

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]
          sw_vers
          xcodebuild -version
          swift --version

      - name: Require distribution credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD}"
          : "${NOTARY_PRIVATE_KEY_BASE64:?Missing NOTARY_PRIVATE_KEY_BASE64}"
          : "${NOTARY_KEY_ID:?Missing NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing NOTARY_ISSUER_ID}"
          : "${SPARKLE_PUBLIC_ED_KEY:?Missing SPARKLE_PUBLIC_ED_KEY}"

      - name: Prepare isolated keychain
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/yohaku-companion-dryrun.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -n 1)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Report certificate expiry
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        shell: bash
        run: |
          set -euo pipefail
          security find-certificate -c "Developer ID Application" -p "$KEYCHAIN_PATH" \
            | openssl x509 -noout -subject -fingerprint -sha1 -enddate

      - name: Archive and export arm64 application
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH" "$DIST_PATH"
          mkdir -p "$EXPORT_PATH" "$DIST_PATH"

          xcodebuild archive \
            -project YohakuCompanion.xcodeproj \
            -scheme YohakuCompanion \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist

      - name: Remove Intel slices and re-sign application
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: bash scripts/prepare_arm64_app.sh "$EXPORT_PATH/YohakuCompanion.app"

      - name: Verify signatures, architectures, and hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$EXPORT_PATH/YohakuCompanion.app"
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          SPARKLE_VERSION="$SPARKLE_FRAMEWORK/Versions/Current"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          for CODE_PATH in \
            "$APP_PATH" \
            "$SPARKLE_FRAMEWORK" \
            "$SPARKLE_VERSION/Autoupdate" \
            "$SPARKLE_VERSION/Updater.app" \
            "$SPARKLE_VERSION/XPCServices/Downloader.xpc" \
            "$SPARKLE_VERSION/XPCServices/Installer.xpc"
          do
            codesign --verify --strict --verbose=2 "$CODE_PATH"
            codesign -dv --verbose=4 "$CODE_PATH" 2>&1 \
              | grep -F "Authority=Developer ID Application:" >/dev/null
          done

          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          printf '%s\n' "$SIGNATURE_INFO"
          if ! grep -E 'CodeDirectory .*flags=.*runtime' <<< "$SIGNATURE_INFO" >/dev/null; then
            echo "Distribution builds must enable the hardened runtime." >&2
            exit 1
          fi

      - name: Notarize and staple application
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$EXPORT_PATH/YohakuCompanion.app"
          SUBMISSION_ZIP="$RUNNER_TEMP/YohakuCompanion-notarization.zip"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMISSION_ZIP"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create, sign, and notarize DMG
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$EXPORT_PATH/YohakuCompanion.app"
          DMG_ROOT="$RUNNER_TEMP/yohaku-companion-dmg"
          DMG_PATH="$DIST_PATH/YohakuCompanion-dryrun.dmg"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/YohakuCompanion.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "Yohaku Companion" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "$DMG_PATH"

          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$DMG_PATH"

          echo "### Dry run passed: signed, hardened, notarized, stapled" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          security default-keychain -d user -s login.keychain-db || true
          security list-keychains -d user -s login.keychain-db || true
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
